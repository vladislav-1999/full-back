services:
    - type: web
      name: todo-api-staging
      runtime: image
      region: frankfurt
      plan: free

      image:
          url: ghcr.io/vladislav-1999/full-back:dev
          creds:
              fromRegistryCreds:
                  name: ghcr-vladislav
      healthCheckPath: /health

      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: todo-db-staging
                property: connectionString
          - key: JWT_SECRET
            sync: false
          - key: NODE_ENV
            value: production
          - key: LOG_LEVEL
            value: info
databases:
    - name: todo-db-staging
      region: frankfurt
      plan: free
